@if (isLoading()) {
<div class="page-content" style="display:flex; justify-content:center; padding:40px;">
  <mat-spinner diameter="48" />
</div>
} @else if (loadError()) {
<div class="page-content" style="padding:24px; color:var(--mat-warn-color, red);">
  <p>{{ loadError() }}</p>
  <button mat-button (click)="onCancel()">Retour aux modules</button>
</div>
} @else if (module(); as mod) {
<div class="page-content">
  <mat-card class="config-card">
    <mat-card-header style="margin-bottom: 20px">
      <mat-card-title>Configuration: {{ mod.name }}</mat-card-title>
      <mat-card-subtitle>{{ mod.location }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form class="config-form" #configForm="ngForm" (ngSubmit)="onSave()">

        <!-- Name -->
        <mat-form-field appearance="outline">
          <mat-label>Nom du module</mat-label>
          <input matInput [(ngModel)]="mod.name" name="name" required [disabled]="!canEdit()">
        </mat-form-field>

        <!-- IP -->
        <mat-form-field appearance="outline">
          <mat-label>Adresse IP</mat-label>
          <input matInput [(ngModel)]="mod.ip" name="ip" required [disabled]="!canEdit()">
        </mat-form-field>

        <!-- Active -->
        <mat-slide-toggle [(ngModel)]="mod.config.actif" name="actif" color="primary" [disabled]="!canEdit()">
          Module Actif
        </mat-slide-toggle>

        <!-- Volume -->
        <mat-label>Volume</mat-label>
        <mat-slider min="0" max="100" step="1" discrete [displayWith]="formatVolumeLabel" [disabled]="!canEdit()">
          <input matSliderThumb [(ngModel)]="mod.config.volume" name="volume" [disabled]="!canEdit()">
        </mat-slider>

        <!-- Mode -->
        <mat-form-field>
          <mat-label>Mode de fonctionnement</mat-label>
          <mat-select [(ngModel)]="mod.config.mode" name="mode" [disabled]="!canEdit()">
            <mat-option value="Manuel">Manuel</mat-option>
            <mat-option value="Automatique">Automatique</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Sound -->
        <mat-slide-toggle [(ngModel)]="mod.config.son" name="son" color="primary" [disabled]="!canEdit()">
          Son activé
        </mat-slide-toggle>

        <mat-card-actions>
          @if (canEdit()) {
          <button mat-flat-button color="primary" type="submit">Sauvegarder</button>
          }
          <button mat-button type="button" (click)="onCancel()">{{ canEdit() ? 'Annuler' : 'Retour' }}</button>
          @if (canEdit()) {
          <button mat-button color="warn" type="button" (click)="onDelete()">Supprimer</button>
          }
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
}
