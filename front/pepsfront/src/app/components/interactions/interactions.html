<div class="page-content">
  <mat-card>
    <mat-card-header>
      <div class="filters-container">
        <!-- Admin Profile Filter -->
        @if (isAdmin()) {
        <mat-form-field appearance="outline" class="profile-select">
          <mat-label>Filtrer par profil</mat-label>
          <mat-select [ngModel]="selectedRole" (ngModelChange)="onProfileChange($event)">
            @for (profile of profiles; track $index) {
            <mat-option [value]="profile.role">{{profile.name}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        }

        <mat-radio-group [(ngModel)]="filter" (ngModelChange)="setFilter($event)">
          <mat-radio-button value="all" checked>Toutes</mat-radio-button>
          <mat-radio-button value="today">Aujourd'hui</mat-radio-button>
          <mat-radio-button value="yesterday">Hier</mat-radio-button>
          <mat-radio-button value="week">Semaine</mat-radio-button>
        </mat-radio-group>
      </div>

      <span class="spacer"></span>
      <div style="display: flex; flex-direction: column; align-items: flex-end;">
        <button mat-flat-button color="primary" (click)="exportAsCsv()"
          [disabled]="filteredInteractions().length === 0">
          <mat-icon>download</mat-icon>
          Exporter CSV
        </button>
        @if (filteredInteractions().length === 0) {
        <span style="font-size: 11px; color: gray; margin-top: 4px;">Aucune donnée à exporter</span>
        }
      </div>
    </mat-card-header>
    <mat-card-content class="table-container">
      <table mat-table [dataSource]="filteredInteractions()">
        <!-- Colonne Date/Heure -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date/Heure </th>
          <td mat-cell *matCellDef="let item"> {{item.date}} </td>
        </ng-container>
        <!-- Colonne Module -->
        <ng-container matColumnDef="module">
          <th mat-header-cell *matHeaderCellDef> Module </th>
          <td mat-cell *matCellDef="let item"> {{item.module}} </td>
        </ng-container>
        <!-- Colonne Type -->
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef> Type </th>
          <td mat-cell *matCellDef="let item"> {{item.type}} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
