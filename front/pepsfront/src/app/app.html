@if (!isInitialized()) {
<!-- Prevent flash: show nothing until session check is complete (SSR hydration) -->
} @else if (showShell()) {
<mat-sidenav-container class="app-container">
  <mat-sidenav [opened]="isSidenavOpen()" mode="side" class="sidenav">
    <div class="sidenav-header">
      <img src="favicon-96x96.png" alt="Logo PEP'S" class="logo" />
      <span class="logo-title">PEP'S</span>
    </div>

    <mat-nav-list>
      <mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Tableau de Bord</span>
      </mat-list-item>

      <mat-list-item routerLink="/interactions" routerLinkActive="active">
        <mat-icon matListItemIcon>history</mat-icon>
        <span matListItemTitle>Interactions</span>
      </mat-list-item>

      <mat-list-item routerLink="/modules" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        <mat-icon matListItemIcon>developer_board</mat-icon>
        <span matListItemTitle>Modules</span>
      </mat-list-item>

      <mat-list-item routerLink="/sounds" routerLinkActive="active">
        <mat-icon matListItemIcon>music_note</mat-icon>
        <span matListItemTitle>Sons</span>
      </mat-list-item>

      <!-- Admin-only items — guard also enforces this at URL level -->
      @if (isAdmin()) {
      <mat-list-item routerLink="/users" routerLinkActive="active">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Utilisateurs</span>
      </mat-list-item>

      <mat-list-item routerLink="/audit-logs" routerLinkActive="active">
        <mat-icon matListItemIcon>fact_check</mat-icon>
        <span matListItemTitle>Journal d'Audit</span>
      </mat-list-item>

      <mat-list-item routerLink="/archive" routerLinkActive="active">
        <mat-icon matListItemIcon>archive</mat-icon>
        <span matListItemTitle>Archive</span>
      </mat-list-item>
      }

      <!-- All authenticated users -->
      <mat-list-item routerLink="/account" routerLinkActive="active">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Mon Compte</span>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="toggleSidenav()" matTooltip="Menu" aria-label="Menu de navigation">
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Spacer -->
      <span class="toolbar-spacer"></span>

      <!-- User login + logout -->
      <span class="user-info">{{ currentLogin() }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Déconnexion" aria-label="Déconnexion">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="page-area">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
} @else {
<router-outlet />
}
