services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: peps-database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: peps-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - peps-network
    restart: unless-stopped

  # Redis Queue
  redis:
    image: redis:7-alpine
    container_name: peps-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Java/Spring) - Web
  backend-web:
    image: peps-backend:latest
    build:
      context: ./back/PEPs_back
      dockerfile: Dockerfile
    container_name: peps-backend-web
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=web
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "--max-time", "5", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend Service (Java/Spring) - Audio Worker
  backend-audio:
    image: peps-backend:latest
    build:
      context: ./back/PEPs_back
      dockerfile: Dockerfile
    container_name: peps-backend-audio
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=audio-worker
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "--max-time", "5", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend Service (Angular)
  frontend:
    build:
      context: ./front/pepsfront
      dockerfile: Dockerfile
    container_name: peps-frontend
    environment:
      - API_URL=${API_URL}
    ports:
      - "4200:80"
    networks:
      - peps-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: peps-proxy
    ports:
      - "${PROXY_PORT}:80"
      - "${PROXY_SSL_PORT}:443"
    depends_on:
      backend-web:
        condition: service_healthy
      backend-audio:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - peps-network
    restart: unless-stopped

networks:
  peps-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
