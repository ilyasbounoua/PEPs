version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: peps-database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - peps-network
    restart: unless-stopped

  # Redis Queue
  redis:
    image: redis:7-alpine
    container_name: peps-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Java/Spring) - Web
  backend-web:
    build:
      context: ./back/PEPs_back
      dockerfile: Dockerfile
    container_name: peps-backend-web
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=web
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - database
      - redis
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Service (Java/Spring) - Audio Worker
  backend-audio:
    build:
      context: ./back/PEPs_back
      dockerfile: Dockerfile
    container_name: peps-backend-audio
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=audio-worker
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      - database
      - redis
    networks:
      - peps-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (Angular)
  frontend:
    build:
      context: ./front/pepsfront
      dockerfile: Dockerfile
    container_name: peps-frontend
    environment:
      - API_URL=${API_URL}
    ports:
      - "4200:80"
    networks:
      - peps-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: peps-proxy
    ports:
      - "${PROXY_PORT}:80"
      - "${PROXY_SSL_PORT}:443"
    depends_on:
      backend-web:
        condition: service_healthy
      backend-audio:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - peps-network
    restart: unless-stopped

networks:
  peps-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
